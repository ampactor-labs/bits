name: deploy

on:
  push:
    branches: [main]
  # Milestone branches are checked before merge, not after: a red PR used to
  # be discovered only once it had already broken main's deploy.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:budget
      - run: npm run test:e2e
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      - run: npm run test:ux
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
          UX_SHOTS_DIR: ux-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-shots
          path: ux-shots
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
